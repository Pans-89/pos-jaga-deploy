services:
  web:
    build: .
    restart: unless-stopped
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in EasyPanel}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in EasyPanel}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-opsconsole}
      DB_USER: ${POSTGRES_USER:-opsconsole}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in EasyPanel}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    cpus: 0.50
    networks: [internal]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsconsole}
      POSTGRES_USER: ${POSTGRES_USER:-opsconsole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in EasyPanel}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=2MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 320m
    cpus: 0.75
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
